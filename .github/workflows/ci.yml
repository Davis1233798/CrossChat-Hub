name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Synthetic LINE host regressions (mock only; no CEF or account)
        run: node --test experiments/line-host/tests/*.test.mjs

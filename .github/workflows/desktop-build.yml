name: Desktop builds (unsigned)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # package-lock is absent until a machine with npm registry access resolves
      # Electron builder dependencies. Commit it before a production release.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run desktop:${{ matrix.target }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CrossChat-Hub-${{ matrix.target }}-unsigned
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

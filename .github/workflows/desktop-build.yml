name: Desktop packages and preview release

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test

  package:
    name: ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 MSI + EXE
            os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
          - label: macOS Intel x64 DMG
            os: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
          - label: macOS Apple Silicon arm64 DMG
            os: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag matches package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="v$(node -p "require('./package.json').version")"
            if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
              exit 1
            fi
          fi
      - name: Install Electron packaging dependencies
        run: npm ci --no-audit --no-fund
      - name: Native Electron window and keyboard smoke (no provider login)
        run: npm run test:desktop
      - name: Build desktop installers
        run: npm run desktop:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
      - name: Validate generated installers
        shell: bash
        run: |
          if [[ '${{ matrix.platform }}' == 'win' ]]; then
            compgen -G 'dist/*.msi' >/dev/null
            compgen -G 'dist/*.exe' >/dev/null
          else
            compgen -G 'dist/*.dmg' >/dev/null
            compgen -G 'dist/*.zip' >/dev/null
          fi
          ls -lh dist/
      - name: Smoke-test Windows install, running reinstall, relaunch and uninstall
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - name: Verify macOS DMG contains usable application bundle
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          disk_image="$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          mkdir -p "$RUNNER_TEMP/crosschat-mount"
          hdiutil attach "$disk_image" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/crosschat-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/crosschat-mount" -quiet || true' EXIT
          test -x "$RUNNER_TEMP/crosschat-mount/CrossChat Hub.app/Contents/MacOS/CrossChat Hub"
          plutil -lint "$RUNNER_TEMP/crosschat-mount/CrossChat Hub.app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: crosschat-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish unsigned GitHub prerelease
    # Do not create an installable Release on every push to main.
    # Only an explicitly created version tag may publish binaries.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crosschat-*
          path: release-assets
          merge-multiple: true
      - name: Verify all three OS/architecture installers exist
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'release-assets/*.msi' >/dev/null
          compgen -G 'release-assets/*x64.dmg' >/dev/null
          compgen -G 'release-assets/*arm64.dmg' >/dev/null
          echo 'Release assets:'
          ls -lh release-assets/
      - name: Publish prerelease (only once per version)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag mismatch: $GITHUB_REF_NAME != $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; will not overwrite it"
            exit 0
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CrossChat Hub $tag (unsigned preview)" \
            --notes 'Unsigned preview builds. Windows MSI/EXE x64; macOS Intel x64 and Apple Silicon arm64 DMG/ZIP. Windows SmartScreen or macOS Gatekeeper may block installation. These binaries are for testing, not notarized production deployment.' \
            --prerelease

services:
  crosschat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/crosschat.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - crosschat_data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  crosschat_data:
